[project]
name = "agent-app-server"
version = "0.1.1"
description = "Single-user responsive Web console for OpenAI Codex threads and turns"
authors = [{name = "sevenjay"}]
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "dynaconf (==3.2.13)",
    "pandas (>=3.0.3,<4.0.0)",
    "fastapi (>=0.110.0)",
    "uvicorn[standard] (>=0.29.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "tomlkit (>=0.14.0,<0.15.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "httpx2 (>=2.7.0,<3.0.0)",
    "openai-codex (>=0.144.4,<0.145.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
requires-poetry = '>=2.0'

[tool.poetry.group.dev]
optional = true

[tool.ruff]
line-length = 140

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:bfxapi.*",
    "ignore::DeprecationWarning:websockets.legacy.*",
]
