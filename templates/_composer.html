<form
  class="composer-shell"
  data-thread-id="{{ thread.id if thread else '' }}"
  x-init='{% if thread %}syncThreadActive({{ thread.id|tojson }}, {{ "true" if active else "false" }}, {{ active.get("model")|tojson if active else "null" }}, {{ active.get("reasoning_effort")|tojson if active else "null" }}, {{ active.get("kind")|tojson if active else "null" }}); {% endif %}$watch("prompt", () => $nextTick(() => resizeComposer($refs.composerInput))); $nextTick(() => resizeComposer($refs.composerInput))'
  @submit.prevent="submitPrompt()"
  @dragover="if ($event.dataTransfer.types.includes('Files')) { $event.preventDefault(); attachmentDragOver = true; }"
  @dragleave="if (!$el.contains($event.relatedTarget)) attachmentDragOver = false"
  @drop="dropComposerFiles($event)"
  :class="{ 'composer-drag-over': attachmentDragOver }"
>
  <div class="composer-surface">
    <input type="file" x-ref="attachmentPicker" class="sr-only" tabindex="-1" aria-label="Choose conversation attachments"
      accept=".png,.jpg,.jpeg,.txt,.md,.log,image/png,image/jpeg,text/plain" multiple
      @change="addComposerFiles($event.target.files); $event.target.value = ''" :disabled="composerSubmitting">
    <div class="attachment-list composer-attachments" x-show="composerAttachments.length" x-cloak aria-live="polite">
      <template x-for="attachment in composerAttachments" :key="attachment.key">
        <div class="attachment-card">
          <template x-if="attachment.preview"><img class="attachment-preview" :src="attachment.preview" :alt="attachment.name"></template>
          <div class="attachment-details">
            <span class="attachment-name" x-text="attachment.name" :title="attachment.name"></span>
            <span class="attachment-meta" x-text="`${attachmentSize(attachment.size)} · ${attachment.status}`"></span>
            <span class="attachment-error" x-show="attachment.error" x-text="attachment.error"></span>
          </div>
          <button type="button" class="attachment-remove" :aria-label="`Remove ${attachment.name}`"
            :disabled="composerSubmitting" @click="removeComposerAttachment(attachment.key)">×</button>
        </div>
      </template>
    </div>
    <label class="sr-only" for="composer-prompt">Message Codex</label>
    <textarea
      id="composer-prompt"
      x-ref="composerInput"
      x-model="prompt"
      @input="resizeComposer($el)"
      @keydown.enter="if (!$event.shiftKey && !$event.isComposing && $event.keyCode !== 229) { $event.preventDefault(); submitPrompt(); }"
      @paste="pasteComposerFiles($event)"
      :readonly="composerSubmitting"
      class="composer-input pretty-scrollbar"
      rows="1"
      maxlength="200000"
      :placeholder="active ? (activeKind === 'goal' ? 'Steer the running goal…' : 'Steer the running turn…') : 'Describe the task, or use /goal…'"
    ></textarea>

    <div class="composer-toolbar">
      <button type="button" class="composer-attach" aria-label="Add attachments"
        title="Add PNG, JPEG, or UTF-8 text files (up to 5, 50 MiB each, 250 MiB total)"
        :disabled="composerSubmitting" @click="$refs.attachmentPicker.click()"><span aria-hidden="true">＋</span></button>
      <div class="composer-actions">
        <button
          x-cloak
          x-show="active"
          type="button"
          class="button-danger composer-stop"
          @click="interruptTurn()"
        >Stop</button>
        <div
          class="model-settings composer-model-settings"
          @click.away="modelSettingsOpen = false"
          @keydown.escape.window="if (modelSettingsOpen) { modelSettingsOpen = false; $refs.settingsTrigger.focus(); }"
        >
          <button
            x-ref="settingsTrigger"
            type="button"
            class="model-settings-trigger"
            aria-controls="composer-model-settings-panel"
            aria-haspopup="dialog"
            :aria-expanded="modelSettingsOpen"
            :title="`${selectedModelLabel} · ${selectedReasoningEffortLabel}`"
            @click="modelSettingsOpen = !modelSettingsOpen; if (modelSettingsOpen) $nextTick(() => $refs.modelSelect.focus())"
          >
            <span class="model-settings-summary">
              <span class="model-settings-model" x-text="selectedModelLabel"></span>
              <span class="model-settings-separator" aria-hidden="true">·</span>
              <span class="model-settings-effort" x-text="selectedReasoningEffortLabel"></span>
            </span>
            <span class="model-settings-chevron" :class="{ 'model-settings-chevron-open': modelSettingsOpen }" aria-hidden="true">⌄</span>
          </button>
          <div
            id="composer-model-settings-panel"
            x-cloak
            x-show="modelSettingsOpen"
            style="display: none;"
            class="model-settings-popover"
            role="dialog"
            aria-label="Model settings"
          >
            <label class="model-settings-field">
              <span class="model-settings-label">Model</span>
              <select
                x-ref="modelSelect"
                class="model-select"
                x-model="model"
                @change="$nextTick(() => { normalizeReasoningEffort(); persistModelSettings(); })"
                aria-label="Codex model"
              >
                <option value="">Default model</option>
                <template x-for="item in models" :key="item.id || item.model">
                  <option :value="item.model || item.id" x-text="item.display_name || item.model || item.id"></option>
                </template>
              </select>
            </label>
            <label class="model-settings-field">
              <span class="model-settings-label">Reasoning</span>
              <select
                class="model-select"
                x-model="reasoningEffort"
                @change="$nextTick(() => persistModelSettings())"
                :disabled="!reasoningEffortOptions.length"
                aria-label="Reasoning effort"
              >
                <option value="" x-text="defaultReasoningEffortLabel"></option>
                <template x-for="option in reasoningEffortOptions" :key="option.value">
                  <option
                    :value="option.value"
                    :title="option.description || ''"
                    x-text="reasoningEffortOptionLabel(option)"
                  ></option>
                </template>
              </select>
            </label>
            <p class="model-settings-hint" x-text="reasoningEffortHint"></p>
          </div>
        </div>
        <button
          type="submit"
          class="composer-submit"
          :disabled="busy || composerSubmitting || attachmentSubmissionUncertain || (!draftSession && !active && !streamReady) || !prompt.trim()"
          :aria-label="active ? 'Steer' : 'Send'"
          :title="active ? 'Steer' : 'Send'"
        >
          <span aria-hidden="true">↑</span>
        </button>
      </div>
    </div>
  </div>
</form>
